{% extends 'layouts/forms.html' %}
{%load static%}

{% block content %}

    <main class="p-12 flex items-center h-screen">
        <section class="w-3/4 mx-auto p-10 bg-gray-800 text-white shadow-xl self-center">

            <div class="grid grid-cols-3 items-center">
                <a href="{% url 'home' %}"><img class="border-2 rounded-full w-24" src="{% static 'img/logo.png' %}"></a>
    
                <h1 class="text-center text-6xl">Sign In</h1>
            </div>
            
            {% if error %}
                <p class="text-red-500 mt-3">*{{ error }}</p>
            {% endif %}
            
            <div>

                <form action="/ingresar/" method="POST">
                    {% csrf_token %}
                    
                    <div class="flex flex-col gap-5 mt-3">
                        <input class="p-2 bg-gray-800 border border-orange-500" type="text" name="username" placeholder="Type your username">

                        <input class="p-2 bg-gray-800 border border-orange-500" type="password" name="password" placeholder="Type your password">

                        <button class="bg-orange-500 py-3 transition duration-300 hover:bg-amber-500">Sign in</button>

                        <p>Don't have an account? <a class="text-blue-500" href="{% url 'signup' %}">Sign up</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

{% endblock %}
