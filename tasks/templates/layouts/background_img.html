{% load static %}
<div class="w-100 h-80 relative">
    <img class="fixed -z-50 top-0 object-cover brightness-50 object-center w-full h-full" src="{% static 'img/background.jpg' %}">

    <div class="absolute start-20 flex items-center text-white font-black text-5xl h-full">
        {% if request.path == '/' %}
            Home
        {% elif request.path == '/nosotros/' %}
            About us
        {% elif request.path == '/tareas/' %}
            Tasks
        {% elif request.path == '/tareas-terminadas/' %}
            Completed Tasks
        {% endif %}
    </div>
</div>
